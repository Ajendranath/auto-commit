name: Daily Commit

on:
  schedule:
    # 11:30 PM IST every day (18:00 UTC)
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Activity Log
        run: |
          echo "activity on $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> activity.log

      - name: Commit Changes
        run: |
          git add activity.log

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily activity"

      - name: Push Changes
        run: |
          git push origin main
